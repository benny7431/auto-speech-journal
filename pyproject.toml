[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "auto-speech-journal"
version = "0.3.1"
description = "Local-first Windows microphone journal with streaming preview and durable transcription."
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [{ name = "benny7431" }]
keywords = [
  "local-first",
  "speech-to-text",
  "voice-journal",
  "whisper",
  "pyside6",
  "windows",
  "offline",
  "traditional-chinese",
  "wasapi",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Win32 (MS Windows)",
  "Intended Audience :: End Users/Desktop",
  "Natural Language :: Chinese (Traditional)",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Topic :: Multimedia :: Sound/Audio",
  "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
  "pyside6==6.11.1",
  "sounddevice==0.5.5",
  "soxr==1.1.0",
  "numpy==2.4.6",
  "sherpa-onnx==1.13.4",
  "faster-whisper==1.2.1",
  "huggingface-hub==1.23.0",
  "ctranslate2==4.8.1",
  "opencc==1.4.1",
  "soundfile==0.13.1",
  "tzdata>=2025.2,<2027",
]

[project.optional-dependencies]
cuda = [
  "nvidia-cudnn-cu12==9.24.0.43; platform_system == 'Windows'",
  "nvidia-cublas-cu12==12.9.2.10; platform_system == 'Windows'",
  "nvidia-cuda-nvrtc-cu12==12.9.86; platform_system == 'Windows'",
]
dev = [
  "pillow==12.3.0",
  "pre-commit==4.6.1",
  "pyinstaller==6.16.0; platform_system == 'Windows'",
  "pytest==8.4.2",
  "pytest-cov==7.0.0",
  "pytest-qt==4.5.0",
  "ruff==0.12.12",
]

[project.urls]
Homepage = "https://github.com/benny7431/auto-speech-journal"
Repository = "https://github.com/benny7431/auto-speech-journal"
Issues = "https://github.com/benny7431/auto-speech-journal/issues"
Documentation = "https://github.com/benny7431/auto-speech-journal/tree/main/docs"
Changelog = "https://github.com/benny7431/auto-speech-journal/blob/main/CHANGELOG.md"

[project.scripts]
auto-speech-journal = "auto_speech_journal.cli:main"

[tool.hatch.build]
exclude = [
  "/artifacts/**",
  "/字體/**",
  "/聲明/**",
  "/src/auto_speech_journal/assets/fonts/**",
]

[tool.hatch.build.targets.wheel]
packages = ["src/auto_speech_journal"]
include = [
  "src/auto_speech_journal/assets/**",
  "src/auto_speech_journal/runtime-models-v1.json",
]
exclude = ["src/auto_speech_journal/assets/fonts/**"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]

[tool.coverage.run]
source = ["auto_speech_journal"]

[tool.coverage.report]
fail_under = 75
show_missing = true

[tool.coverage.xml]
output = "coverage.xml"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
