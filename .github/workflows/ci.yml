name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Windows / Python 3.11
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      PYTHONUTF8: "1"
      PYTHONPATH: ${{ github.workspace }}\src
      QT_QPA_PLATFORM: offscreen
      QT_QUICK_BACKEND: software
      QSG_RHI_BACKEND: software

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install locked development environment
        shell: pwsh
        run: |
          uv lock --check
          if ($LASTEXITCODE -ne 0) { throw "uv.lock is not synchronized" }
          uv sync --frozen --no-editable --extra dev

      - name: Ruff
        run: uv run --no-sync ruff check src tests tools

      - name: Pre-commit repository checks
        run: uv run --no-sync pre-commit run --all-files

      - name: Pytest and coverage
        run: >-
          uv run --no-sync pytest
          --cov=auto_speech_journal
          --cov-report=term-missing
          --cov-report=xml:coverage.xml
          --cov-fail-under=75

      - name: Self-test without models or microphone
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP "auto-speech-journal-self-test"
          $env:LOCALAPPDATA = Join-Path $root "local-app-data"
          $env:USERPROFILE = Join-Path $root "profile"
          $env:HOME = $env:USERPROFILE
          New-Item -ItemType Directory -Force -Path (Join-Path $env:USERPROFILE "Documents") | Out-Null
          uv run --no-sync python -m auto_speech_journal self-test --no-model-check --no-microphone-check

      - name: Validate all 192 scene assets
        run: uv run --no-sync python tools/validate_scene_assets.py --strict

      - name: Build wheel and source distribution
        run: uv build

      - name: Verify wheel contents
        run: uv run --no-sync python tools/verify_wheel_contents.py

      - name: Upload build and coverage artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: auto-speech-journal-${{ github.sha }}
          path: |
            dist/*.whl
            dist/*.tar.gz
            coverage.xml
          if-no-files-found: error
          retention-days: 14
