name: Validate pinned Hugging Face runtime models

on:
  workflow_dispatch:
    inputs:
      run_reference_gate:
        description: Download all pinned models and run the reviewed reference transcript gate
        required: true
        type: boolean
        default: false
  pull_request:
    paths:
      - "packaging/manifests/runtime-models-v1.json"
      - "packaging/models/**"
      - "src/auto_speech_journal/model_download.py"
      - "src/auto_speech_journal/runtime_models.py"
      - "tests/test_runtime_models.py"
      - ".github/workflows/models.yml"
  push:
    branches: [main]
    paths:
      - "packaging/manifests/runtime-models-v1.json"
      - "packaging/models/**"
      - "src/auto_speech_journal/model_download.py"
      - "src/auto_speech_journal/runtime_models.py"
      - "tests/test_runtime_models.py"
      - ".github/workflows/models.yml"

permissions:
  contents: read

concurrency:
  group: runtime-models-${{ github.ref }}
  cancel-in-progress: true

jobs:
  manifest-contract:
    name: Pinned Hugging Face manifest contract
    runs-on: windows-latest
    env:
      PYTHONPATH: ${{ github.workspace }}\src
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"

      - name: Install locked test environment
        shell: pwsh
        run: uv sync --frozen --no-editable --extra dev

      - name: Validate pinned repositories, revisions, files, sizes, hashes, and licenses
        shell: pwsh
        run: >-
          uv run --no-sync python packaging/models/validate_runtime_model_manifest.py
          --manifest packaging/manifests/runtime-models-v1.json

      - name: Run runtime model supply-chain tests
        shell: pwsh
        run: >-
          uv run --no-sync pytest
          tests/test_runtime_models.py
          tests/test_model_release_gate.py
          tests/test_provisioning.py

  reference-inference:
    name: Full Preview, VAD, and CPU Whisper reference inference
    if: github.event_name == 'workflow_dispatch' && inputs.run_reference_gate
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      PYTHONPATH: ${{ github.workspace }}/src
      REFERENCE_APPROVED_SHA: ${{ vars.RUNTIME_MODELS_REFERENCE_TRANSCRIPT_APPROVED_SHA }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Enforce reviewed reference gate approval for this commit
        shell: pwsh
        run: |
          if ($env:REFERENCE_APPROVED_SHA -ne $env:GITHUB_SHA) {
            throw "Reference transcript approval does not match this commit"
          }
          $gate = Get-Content packaging/models/reference-audio-gate.json -Raw -Encoding UTF8 |
            ConvertFrom-Json
          if ($gate.status -ne 'ready') {
            throw "Reference audio gate is not ready"
          }

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"

      - name: Install locked runtime and test environment
        shell: pwsh
        run: uv sync --frozen --no-editable --extra dev

      - name: Download ready-to-run artifacts directly from pinned Hugging Face commits
        shell: pwsh
        run: |
          $progress = Join-Path $env:RUNNER_TEMP 'runtime-model-progress.json'
          uv run --no-sync python -m auto_speech_journal provision `
            --manifest packaging/manifests/runtime-models-v1.json `
            --progress-json $progress
          if ($LASTEXITCODE -ne 0) { throw "Runtime model provisioning failed" }

      - name: Run reference transcription and CPU fallback gate
        shell: pwsh
        run: |
          $models = Join-Path $env:LOCALAPPDATA 'AutoSpeechJournal\models'
          uv run --no-sync python packaging/models/verify_runtime_models.py `
            --manifest packaging/manifests/runtime-models-v1.json `
            --models-dir $models `
            --reference-spec packaging/models/reference-audio-gate.json `
            --repository-root . | Tee-Object -FilePath runtime-model-validation.json
          if ($LASTEXITCODE -ne 0) { throw "Runtime model reference inference failed" }

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: runtime-model-reference-${{ github.sha }}
          path: |
            runtime-model-validation.json
            ${{ runner.temp }}/runtime-model-progress.json
          if-no-files-found: warn
          retention-days: 14
