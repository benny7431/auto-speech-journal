name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  checks: read
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish unsigned release
    runs-on: windows-latest
    timeout-minutes: 180
    env:
      PYTHONUTF8: "1"
      PYTHONPATH: ${{ github.workspace }}\src
      QT_QPA_PLATFORM: offscreen
      QT_QUICK_BACKEND: software
      QSG_RHI_BACKEND: software

    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Validate tag and install locked environment
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          uv lock --check
          if ($LASTEXITCODE -ne 0) { throw "uv.lock is stale" }
          uv sync --frozen --no-editable --extra dev
          if ($LASTEXITCODE -ne 0) { throw "Locked build environment installation failed" }

          $tag = $env:GITHUB_REF_NAME
          $version = uv run --no-sync python -c `
            "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])"
          if ($LASTEXITCODE -ne 0 -or $tag -ne "v$version") {
            throw "Tag $tag does not match pyproject.toml version $version"
          }
          git merge-base --is-ancestor $env:GITHUB_SHA origin/main
          if ($LASTEXITCODE -ne 0) { throw "Release tag must point to a commit on main" }

          $releaseTags = gh api --paginate `
            "repos/$env:GITHUB_REPOSITORY/releases?per_page=100" --jq '.[].tag_name'
          if ($LASTEXITCODE -ne 0) { throw "Cannot query existing releases" }
          if (@($releaseTags) -contains $tag) {
            throw "Release $tag already exists. Publish a new patch tag instead of replacing assets."
          }

      - name: Wait for required checks on the tagged commit
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $required = @(
            "Windows / Python 3.11",
            "Python security-extended",
            "Unsigned installer contract"
          )
          $deadline = [DateTime]::UtcNow.AddMinutes(60)
          while ($true) {
            $response = gh api `
              "repos/$env:GITHUB_REPOSITORY/commits/$env:GITHUB_SHA/check-runs?per_page=100"
            if ($LASTEXITCODE -ne 0) { throw "Cannot query required commit checks" }
            $runs = @(($response | ConvertFrom-Json).check_runs)
            $pending = @()
            foreach ($name in $required) {
              $run = $runs | Where-Object { $_.name -eq $name } |
                Sort-Object started_at -Descending | Select-Object -First 1
              if ($null -eq $run -or $run.status -ne "completed") {
                $pending += $name
              }
              elseif ($run.conclusion -ne "success") {
                throw "Required check '$name' concluded '$($run.conclusion)'"
              }
            }
            if ($pending.Count -eq 0) { break }
            if ([DateTime]::UtcNow -ge $deadline) {
              throw "Timed out waiting for required checks: $($pending -join ', ')"
            }
            Write-Host "Waiting for required checks: $($pending -join ', ')"
            Start-Sleep -Seconds 20
          }

      - name: Run Ruff and tests
        shell: pwsh
        run: |
          uv run --no-sync ruff check src tests tools packaging
          if ($LASTEXITCODE -ne 0) { throw "Ruff failed" }
          uv run --no-sync pytest `
            --cov=auto_speech_journal `
            --cov-report=term-missing `
            --cov-fail-under=75
          if ($LASTEXITCODE -ne 0) { throw "Tests or coverage gate failed" }

      - name: Build wheel and source distribution
        shell: pwsh
        run: |
          uv build
          if ($LASTEXITCODE -ne 0) { throw "Python distribution build failed" }

          $version = $env:GITHUB_REF_NAME.Substring(1)
          $expected = @(
            "auto_speech_journal-$version-py3-none-any.whl",
            "auto_speech_journal-$version.tar.gz"
          ) | Sort-Object
          $actual = @(Get-ChildItem dist -File | Where-Object {
            $_.Extension -eq ".whl" -or $_.Name.EndsWith(".tar.gz")
          } | Select-Object -ExpandProperty Name | Sort-Object)
          if ($actual.Count -ne 2 -or (Compare-Object $expected $actual)) {
            throw "Expected exactly one wheel and one source distribution: $($actual -join ', ')"
          }

      - name: Install pinned Inno Setup
        shell: pwsh
        run: |
          winget install --id JRSoftware.InnoSetup -e --version 6.7.3 `
            --silent --accept-package-agreements --accept-source-agreements
          if ($LASTEXITCODE -ne 0) { throw "Pinned Inno Setup installation failed" }

      - name: Build unsigned Setup
        shell: powershell
        run: |
          & .\tools\build_windows_installer.ps1 -ReleaseBuild
          if (-not $?) { throw "Unsigned Windows package build failed" }

      - name: Prepare release files and checksums
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.Substring(1)
          $output = Join-Path $PWD "artifacts\release"
          New-Item -ItemType Directory -Force -Path $output | Out-Null

          $files = @(
            "artifacts\windows\setup\AutoSpeechJournal-Setup-$version-x64.exe",
            "dist\auto_speech_journal-$version-py3-none-any.whl",
            "dist\auto_speech_journal-$version.tar.gz"
          )
          foreach ($file in $files) {
            if (-not (Test-Path -LiteralPath $file -PathType Leaf)) {
              throw "Release file is missing: $file"
            }
            Copy-Item -LiteralPath $file -Destination $output
          }

          $checksums = foreach ($file in @(Get-ChildItem $output -File | Sort-Object Name)) {
            $hash = (Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($file.Name)"
          }
          [IO.File]::WriteAllLines(
            (Join-Path $output "SHA256SUMS.txt"),
            $checksums,
            (New-Object Text.UTF8Encoding($false))
          )

          $changelog = @(Get-Content CHANGELOG.md -Encoding UTF8)
          $heading = '^## \[' + [regex]::Escape($version) + '\](?: - .+)?$'
          $start = -1
          for ($index = 0; $index -lt $changelog.Count; $index++) {
            if ($changelog[$index] -match $heading) { $start = $index; break }
          }
          if ($start -lt 0) { throw "CHANGELOG.md has no section for $version" }
          $end = $changelog.Count
          for ($index = $start + 1; $index -lt $changelog.Count; $index++) {
            if ($changelog[$index] -match '^## \[') { $end = $index; break }
          }
          $notes = @(
            "# Auto Speech Journal $version",
            "",
            "## 下載 Windows 版",
            "",
            "下載 AutoSpeechJournal-Setup-$version-x64.exe，完成安裝後即可從首次設定選擇麥克風與日記資料夾。",
            "Python wheel 與原始碼套件提供進階安裝與檢查用途。",
            ""
          ) + $changelog[$start..($end - 1)] + @(
            "",
            "## Windows 安裝器提醒",
            "",
            "目前 Windows 執行檔未簽章；若出現 Unknown publisher／SmartScreen，請核對 SHA256SUMS.txt，無須關閉 Defender。"
          )
          [IO.File]::WriteAllLines(
            (Join-Path $output "RELEASE-NOTES.md"),
            $notes,
            (New-Object Text.UTF8Encoding($false))
          )

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $version = $tag.Substring(1)
          $isStable = $version -match '^\d+\.\d+\.\d+$'
          $releaseArgs = @(
            "release",
            "create",
            $tag,
            "--verify-tag",
            "--title",
            $tag,
            "--notes-file",
            "artifacts/release/RELEASE-NOTES.md"
          )
          if ($isStable) {
            $releaseArgs += "--latest"
          }
          else {
            $releaseArgs += @("--prerelease", "--latest=false")
          }
          $releaseArgs += @(
            "artifacts/release/AutoSpeechJournal-Setup-$version-x64.exe",
            "artifacts/release/auto_speech_journal-$version-py3-none-any.whl",
            "artifacts/release/auto_speech_journal-$version.tar.gz",
            "artifacts/release/SHA256SUMS.txt"
          )
          gh @releaseArgs
          if ($LASTEXITCODE -ne 0) { throw "Release publication failed" }
