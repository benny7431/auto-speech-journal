name: Windows package

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Unsigned installer contract
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      PYTHONUTF8: "1"
      PYTHONPATH: ${{ github.workspace }}\src
      QT_QPA_PLATFORM: offscreen
      QT_QUICK_BACKEND: software
      QSG_RHI_BACKEND: software

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Verify and install locked build environment
        shell: pwsh
        run: |
          uv lock --check
          if ($LASTEXITCODE -ne 0) { throw "uv.lock is stale" }
          uv sync --frozen --no-editable --extra dev
          if ($LASTEXITCODE -ne 0) { throw "Locked build environment installation failed" }

      - name: Run packaging contract tests
        shell: pwsh
        run: |
          uv run --no-sync ruff check packaging `
            tests/test_windows_packaging_contract.py `
            tests/test_runtime_models.py `
            tests/test_release_artifact_validators.py `
            tests/test_model_release_gate.py
          if ($LASTEXITCODE -ne 0) { throw "Windows packaging lint failed" }
          uv run --no-sync pytest -q `
            tests/test_windows_packaging_contract.py `
            tests/test_runtime_models.py `
            tests/test_release_artifact_validators.py `
            tests/test_model_release_gate.py
          if ($LASTEXITCODE -ne 0) { throw "Windows packaging contract tests failed" }
          uv run --no-sync python packaging/models/validate_runtime_model_manifest.py `
            --manifest packaging/manifests/runtime-models-v1.json
          if ($LASTEXITCODE -ne 0) { throw "Pinned Hugging Face model manifest validation failed" }
          uv run --no-sync python packaging/manifests/validate_cuda_manifest.py `
            --manifest packaging/manifests/cuda-runtime-v1.json `
            --lock uv.lock
          if ($LASTEXITCODE -ne 0) { throw "Pinned CUDA manifest validation failed" }

      - name: Install pinned Inno Setup
        shell: pwsh
        run: |
          winget install --id JRSoftware.InnoSetup -e --version 6.7.3 `
            --silent --accept-package-agreements --accept-source-agreements
          if ($LASTEXITCODE -ne 0) { throw "Pinned Inno Setup installation failed" }

      - name: Build exact wheel and source distribution
        shell: pwsh
        run: |
          uv build
          if ($LASTEXITCODE -ne 0) { throw "Python distribution build failed" }
          uv run --no-sync python tools/verify_wheel_contents.py
          if ($LASTEXITCODE -ne 0) { throw "Wheel content verification failed" }

          $version = uv run --no-sync python -c `
            "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])"
          if ($LASTEXITCODE -ne 0) { throw "Cannot read project version" }
          $expected = @(
            "auto_speech_journal-$version-py3-none-any.whl",
            "auto_speech_journal-$version.tar.gz"
          )
          $actual = @(Get-ChildItem dist -File | Where-Object {
            ($_.Extension -eq ".whl" -or $_.Name.EndsWith(".tar.gz")) -and
            $_.Name -ne "default.gitignore"
          } | Select-Object -ExpandProperty Name | Sort-Object)
          if ($actual.Count -ne 2 -or (Compare-Object ($expected | Sort-Object) $actual)) {
            throw "Expected exact versioned wheel and source distribution; found: $($actual -join ', ')"
          }

      - name: Build application and Setup
        shell: powershell
        run: |
          & .\tools\build_windows_installer.ps1 -Stage All
          if (-not $?) { throw "Windows package build failed" }

      - name: Verify frozen runtime inventory and SBOM
        shell: pwsh
        run: |
          uv run --no-sync python packaging/windows/runtime_inventory.py validate `
            --sbom artifacts/windows/application/AutoSpeechJournal.cdx.json `
            --inventory artifacts/windows/application/payload/frozen-runtime-inventory.json `
            --lock uv.lock `
            --pyproject pyproject.toml `
            --payload artifacts/windows/application/payload
          if ($LASTEXITCODE -ne 0) { throw "Frozen runtime/SBOM inventory validation failed" }

      - name: Verify frozen QML and Windows artifacts
        shell: powershell
        run: |
          & .\tools\verify_windows_installer.ps1
          if (-not $?) { throw "Windows artifact verification failed" }

      - name: Install, probe, and uninstall as the current non-elevated user
        shell: powershell
        run: |
          $version = uv run --no-sync python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])"
          if ($LASTEXITCODE -ne 0) { throw "Cannot read project version" }
          $setup = Join-Path $PWD "artifacts\windows\setup\AutoSpeechJournal-Setup-$version-x64.exe"
          $target = Join-Path $env:RUNNER_TEMP "AutoSpeechJournal-E2E"
          $e2eLogs = Join-Path $PWD "artifacts\windows\e2e"
          New-Item -ItemType Directory -Force -Path $e2eLogs | Out-Null
          $installLog = Join-Path $e2eLogs "install.log"
          $install = Start-Process -FilePath $setup -ArgumentList @(
            "/VERYSILENT",
            "/SUPPRESSMSGBOXES",
            "/NORESTART",
            "/NOMODELS",
            "/NOGPU",
            "/DIR=$target",
            "/LOG=$installLog"
          ) -WindowStyle Hidden -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Setup failed: $($install.ExitCode)" }
          $installedCli = Join-Path $target "AutoSpeechJournal.CLI.exe"
          if (-not (Test-Path -LiteralPath $installedCli -PathType Leaf)) {
            Get-Content -LiteralPath $installLog -Tail 100 -ErrorAction SilentlyContinue
            throw "Setup reported success but the stable CLI launcher is missing: $installedCli"
          }
          & $installedCli installer-probe --isolated
          if ($LASTEXITCODE -ne 0) { throw "Installed launcher probe failed: $LASTEXITCODE" }

          $runtime = Join-Path $env:LOCALAPPDATA "AutoSpeechJournal"
          New-Item -ItemType Directory -Force -Path $runtime | Out-Null
          $currentManifest = Join-Path $target 'current.json'
          if (-not (Test-Path -LiteralPath $currentManifest -PathType Leaf)) {
            throw "Setup did not activate current.json"
          }
          $currentManifestHash = (Get-FileHash -LiteralPath $currentManifest -Algorithm SHA256).Hash

          function Copy-JsonObject([object]$Value) {
            return ($Value | ConvertTo-Json -Depth 12 | ConvertFrom-Json)
          }

          function Write-JsonNoBom([string]$Path, [object]$Value) {
            $json = ($Value | ConvertTo-Json -Depth 12) + "`n"
            [IO.File]::WriteAllText($Path, $json, (New-Object Text.UTF8Encoding($false)))
          }

          function New-VadManifest(
            [object]$Canonical,
            [string]$Release,
            [string]$Destination,
            [string]$Sha256
          ) {
            $model = Copy-JsonObject (@($Canonical.models | Where-Object name -eq 'silero-vad')[0])
            $model.destination = $Destination
            $model.files[0].sha256 = $Sha256
            return [ordered]@{
              schema_version = 1
              release = $Release
              provider = 'huggingface'
              models = @($model)
            }
          }

          $canonical = Get-Content packaging/manifests/runtime-models-v1.json `
            -Raw -Encoding UTF8 | ConvertFrom-Json
          $vad = @($canonical.models | Where-Object name -eq 'silero-vad')[0]
          $vadFile = $vad.files[0]
          $expectedVadHash = [string]$vadFile.sha256
          $resumeRelease = 'runtime-models-v1-e2e-resume'
          $resumeDestination = 'e2e-hf-vad-resume'
          $resumeManifest = Join-Path $e2eLogs 'runtime-models-v1-e2e-resume.json'
          Write-JsonNoBom $resumeManifest (
            New-VadManifest $canonical $resumeRelease $resumeDestination $expectedVadHash
          )

          $resumePart = Join-Path $runtime `
            "models\.downloads\$resumeRelease\$resumeDestination\silero_vad.onnx.part"
          New-Item -ItemType Directory -Force -Path (Split-Path -Parent $resumePart) | Out-Null
          $vadUrl = "https://huggingface.co/$($vad.repository)/resolve/$($vad.revision)/$($vadFile.path)"
          & curl.exe --fail --location --retry 3 --range 0-65535 --output $resumePart $vadUrl
          if ($LASTEXITCODE -ne 0) { throw "Cannot seed the Hugging Face resume E2E" }
          $partStream = [IO.File]::Open(
            $resumePart,
            [IO.FileMode]::Open,
            [IO.FileAccess]::Write,
            [IO.FileShare]::None
          )
          try {
            if ($partStream.Length -ge [int64]$vadFile.size) {
              $partStream.SetLength(65536)
            }
          }
          finally {
            $partStream.Dispose()
          }
          $partialSize = (Get-Item -LiteralPath $resumePart).Length
          if ($partialSize -le 0 -or $partialSize -ge [int64]$vadFile.size) {
            throw "Resume fixture is not a proper partial file: $partialSize"
          }

          $resumeProgress = Join-Path $e2eLogs 'hf-resume-progress.json'
          & $installedCli provision --manifest $resumeManifest --progress-json $resumeProgress
          if ($LASTEXITCODE -ne 0) { throw "Pinned Hugging Face Range/resume E2E failed" }
          $resumeVad = Join-Path $runtime "models\$resumeDestination\silero_vad.onnx"
          if ((Get-FileHash -LiteralPath $resumeVad -Algorithm SHA256).Hash.ToLowerInvariant() `
              -ne $expectedVadHash) {
            throw "Resumed Hugging Face VAD hash mismatch"
          }

          & $installedCli repair models --manifest $resumeManifest --progress-json $resumeProgress
          if ($LASTEXITCODE -ne 0) { throw "Repair models could not reuse the verified VAD" }

          $retryRelease = 'runtime-models-v1-e2e-retry'
          $retryDestination = 'e2e-hf-vad-retry'
          $retryManifest = Join-Path $e2eLogs 'runtime-models-v1-e2e-retry.json'
          Write-JsonNoBom $retryManifest (
            New-VadManifest $canonical $retryRelease $retryDestination $expectedVadHash
          )
          $retryPart = Join-Path $runtime `
            "models\.downloads\$retryRelease\$retryDestination\silero_vad.onnx.part"
          New-Item -ItemType Directory -Force -Path (Split-Path -Parent $retryPart) | Out-Null
          $retryStream = [IO.File]::Open(
            $retryPart,
            [IO.FileMode]::Create,
            [IO.FileAccess]::Write,
            [IO.FileShare]::None
          )
          try {
            $retryStream.SetLength([int64]$vadFile.size)
          }
          finally {
            $retryStream.Dispose()
          }
          $retryProgress = Join-Path $e2eLogs 'hf-corrupt-part-retry-progress.json'
          & $installedCli provision --manifest $retryManifest --progress-json $retryProgress
          if ($LASTEXITCODE -ne 0) { throw "Corrupt .part discard/retry E2E failed" }
          $retryVad = Join-Path $runtime "models\$retryDestination\silero_vad.onnx"
          if ((Get-FileHash -LiteralPath $retryVad -Algorithm SHA256).Hash.ToLowerInvariant() `
              -ne $expectedVadHash) {
            throw "Retried Hugging Face VAD hash mismatch"
          }

          $corruptStream = [IO.File]::Open(
            $resumeVad,
            [IO.FileMode]::Open,
            [IO.FileAccess]::ReadWrite,
            [IO.FileShare]::None
          )
          try {
            $firstByte = $corruptStream.ReadByte()
            $corruptStream.Position = 0
            $corruptStream.WriteByte([byte]($firstByte -bxor 255))
          }
          finally {
            $corruptStream.Dispose()
          }
          & $installedCli repair models --manifest $resumeManifest --progress-json $resumeProgress
          if ($LASTEXITCODE -ne 0) { throw "Repair models did not repair installed corruption" }
          if ((Get-FileHash -LiteralPath $resumeVad -Algorithm SHA256).Hash.ToLowerInvariant() `
              -ne $expectedVadHash) {
            throw "Repair models retained corrupt model bytes"
          }

          $badManifest = Join-Path $e2eLogs 'runtime-models-v1-e2e-bad-hash.json'
          Write-JsonNoBom $badManifest (
            New-VadManifest $canonical 'runtime-models-v1-e2e-bad-hash' `
              $resumeDestination ('a' * 64)
          )
          $goodModelHash = (Get-FileHash -LiteralPath $resumeVad -Algorithm SHA256).Hash
          $badProgress = Join-Path $e2eLogs 'hf-bad-hash-progress.json'
          & $installedCli repair models --manifest $badManifest --progress-json $badProgress
          $badExit = $LASTEXITCODE
          if ($badExit -eq 0) { throw "A wrong Hugging Face SHA-256 unexpectedly succeeded" }
          if (-not (Test-Path -LiteralPath $installedCli -PathType Leaf)) {
            throw "Model failure rolled back the installed program"
          }
          if ((Get-FileHash -LiteralPath $currentManifest -Algorithm SHA256).Hash `
              -ne $currentManifestHash) {
            throw "Model failure changed the active application manifest"
          }
          if ((Get-FileHash -LiteralPath $resumeVad -Algorithm SHA256).Hash -ne $goodModelHash) {
            throw "Failed model repair replaced the previously verified model"
          }
          & $installedCli installer-probe --isolated
          if ($LASTEXITCODE -ne 0) {
            throw "Application was not usable after expected model failure"
          }

          $preserved = @(
            (Join-Path $runtime "config.json"),
            (Join-Path $runtime "state.db"),
            (Join-Path $runtime "state.db-wal"),
            (Join-Path $runtime "spool\pending.flac"),
            (Join-Path $runtime "models\fixture\model.bin")
          )
          foreach ($path in $preserved) {
            New-Item -ItemType Directory -Force -Path (Split-Path -Parent $path) | Out-Null
            Set-Content -LiteralPath $path -Value "preserve" -Encoding UTF8
          }
          $uninstaller = Join-Path $target "unins000.exe"
          $uninstallLog = Join-Path $e2eLogs "uninstall.log"
          $uninstall = Start-Process -FilePath $uninstaller -ArgumentList @(
            "/VERYSILENT",
            "/SUPPRESSMSGBOXES",
            "/NORESTART",
            "/LOG=$uninstallLog"
          ) -WindowStyle Hidden -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) { throw "Uninstall failed: $($uninstall.ExitCode)" }
          if (Test-Path -LiteralPath $installedCli) {
            throw "Uninstall retained the stable CLI launcher: $installedCli"
          }
          foreach ($path in $preserved) {
            if (-not (Test-Path -LiteralPath $path)) {
              throw "Uninstall removed runtime data: $path"
            }
          }
          foreach ($path in @($resumeVad, $retryVad)) {
            if (-not (Test-Path -LiteralPath $path)) {
              throw "Uninstall removed a downloaded Hugging Face model: $path"
            }
          }

      - name: Upload internal unsigned artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: auto-speech-journal-windows-unsigned-${{ github.sha }}
          path: |
            artifacts/windows/application/
            artifacts/windows/setup/*.exe
            artifacts/windows/build-metadata.json
            artifacts/windows/WINDOWS-VERIFICATION.json
            artifacts/windows/e2e/
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error
          retention-days: 14
