name: Windows package

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Unsigned installer contract
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      PYTHONUTF8: "1"
      PYTHONPATH: ${{ github.workspace }}\src
      QT_QPA_PLATFORM: offscreen
      QT_QUICK_BACKEND: software
      QSG_RHI_BACKEND: software

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install locked build environment
        shell: pwsh
        run: |
          uv lock --check
          if ($LASTEXITCODE -ne 0) { throw "uv.lock is stale" }
          uv sync --frozen --no-editable --extra dev
          if ($LASTEXITCODE -ne 0) { throw "Locked build environment installation failed" }

      - name: Run focused packaging tests
        shell: pwsh
        run: |
          uv run --no-sync ruff check packaging/windows tests/test_windows_packaging_contract.py
          if ($LASTEXITCODE -ne 0) { throw "Windows packaging lint failed" }
          uv run --no-sync pytest -q tests/test_windows_packaging_contract.py
          if ($LASTEXITCODE -ne 0) { throw "Windows packaging contract tests failed" }

      - name: Install pinned Inno Setup
        shell: pwsh
        run: |
          winget install --id JRSoftware.InnoSetup -e --version 6.7.3 `
            --silent --accept-package-agreements --accept-source-agreements
          if ($LASTEXITCODE -ne 0) { throw "Pinned Inno Setup installation failed" }

      - name: Build application and unsigned Setup
        shell: powershell
        run: |
          & .\tools\build_windows_installer.ps1 -ReleaseBuild
          if (-not $?) { throw "Windows package build failed" }

      - name: Install, launch, reinstall, and uninstall without elevation
        shell: powershell
        run: |
          $version = uv run --no-sync python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])"
          if ($LASTEXITCODE -ne 0) { throw "Cannot read project version" }

          $root = Join-Path $env:RUNNER_TEMP "asj-package-e2e-$([Guid]::NewGuid().ToString('N'))"
          $env:USERPROFILE = Join-Path $root "Profile"
          $env:HOME = $env:USERPROFILE
          $env:LOCALAPPDATA = Join-Path $env:USERPROFILE "AppData\Local"
          $env:APPDATA = Join-Path $env:USERPROFILE "AppData\Roaming"
          foreach ($directory in @(
            $env:LOCALAPPDATA,
            $env:APPDATA,
            (Join-Path $env:USERPROFILE "Documents")
          )) {
            New-Item -ItemType Directory -Force -Path $directory | Out-Null
          }

          $setup = Join-Path $PWD "artifacts\windows\setup\AutoSpeechJournal-Setup-$version-x64.exe"
          $target = Join-Path $env:LOCALAPPDATA "Programs\AutoSpeechJournal\app"
          $logs = Join-Path $PWD "artifacts\windows\e2e"
          New-Item -ItemType Directory -Force -Path $logs | Out-Null

          function Invoke-Setup([string]$LogPath) {
            $process = Start-Process -FilePath $setup -ArgumentList @(
              "/VERYSILENT",
              "/SUPPRESSMSGBOXES",
              "/NORESTART",
              "/DIR=$target",
              "/LOG=$LogPath"
            ) -WindowStyle Hidden -Wait -PassThru
            if ($process.ExitCode -ne 0) {
              Get-Content -LiteralPath $LogPath -Tail 100 -ErrorAction SilentlyContinue
              throw "Setup failed: $($process.ExitCode)"
            }
          }

          Invoke-Setup (Join-Path $logs "install.log")
          $gui = Join-Path $target "AutoSpeechJournal.exe"
          $cli = Join-Path $target "AutoSpeechJournal.CLI.exe"
          foreach ($executable in @($gui, $cli)) {
            if (-not (Test-Path -LiteralPath $executable -PathType Leaf)) {
              throw "Setup did not install the direct application executable: $executable"
            }
          }

          & $cli self-test `
            --no-model-check `
            --no-microphone-check `
            --allow-cpu-finalizer
          if ($LASTEXITCODE -ne 0) { throw "Installed direct CLI self-test failed" }

          $application = Start-Process -FilePath $gui -WorkingDirectory $target -PassThru
          try {
            Start-Sleep -Seconds 8
            if ($application.HasExited) {
              throw "The installed GUI exited during the launch smoke test: $($application.ExitCode)"
            }
          }
          finally {
            if (-not $application.HasExited) {
              Stop-Process -Id $application.Id -Force
              $application.WaitForExit()
            }
          }

          $runtime = Join-Path $env:LOCALAPPDATA "AutoSpeechJournal"
          $externalJournal = Join-Path $root "ExternalJournal\journal.md"
          $sentinels = @(
            (Join-Path $runtime "config.json"),
            (Join-Path $runtime "state.db"),
            (Join-Path $runtime "state.db-wal"),
            (Join-Path $runtime "spool\pending.flac"),
            (Join-Path $runtime "models\fixture\model.bin"),
            $externalJournal
          )
          $expected = @{}
          foreach ($path in $sentinels) {
            New-Item -ItemType Directory -Force -Path (Split-Path -Parent $path) | Out-Null
            $bytes = [Text.Encoding]::UTF8.GetBytes("preserve:$path")
            [IO.File]::WriteAllBytes($path, $bytes)
            $expected[$path] = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash
          }

          $stalePayload = Join-Path $target "_internal\obsolete-plugin.dll"
          New-Item -ItemType Directory -Force -Path (Split-Path -Parent $stalePayload) |
            Out-Null
          [IO.File]::WriteAllBytes($stalePayload, [byte[]](1, 2, 3, 4))

          Invoke-Setup (Join-Path $logs "reinstall.log")
          if (Test-Path -LiteralPath $stalePayload) {
            throw "Reinstall retained stale application payload: $stalePayload"
          }
          foreach ($path in $sentinels) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Reinstall removed preserved data: $path"
            }
            if ((Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash -ne $expected[$path]) {
              throw "Reinstall changed preserved data: $path"
            }
          }

          $uninstaller = Join-Path $env:LOCALAPPDATA `
            "Programs\AutoSpeechJournal\uninstall\unins000.exe"
          $uninstallLog = Join-Path $logs "uninstall.log"
          $uninstall = Start-Process -FilePath $uninstaller -ArgumentList @(
            "/VERYSILENT",
            "/SUPPRESSMSGBOXES",
            "/NORESTART",
            "/LOG=$uninstallLog"
          ) -WindowStyle Hidden -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) {
            Get-Content -LiteralPath $uninstallLog -Tail 100 -ErrorAction SilentlyContinue
            throw "Uninstall failed: $($uninstall.ExitCode)"
          }
          if (Test-Path -LiteralPath $gui -PathType Leaf) {
            throw "Uninstall retained the application executable"
          }
          foreach ($path in $sentinels) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Uninstall removed preserved data: $path"
            }
            if ((Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash -ne $expected[$path]) {
              throw "Uninstall changed preserved data: $path"
            }
          }

      - name: Upload unsigned Setup
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: AutoSpeechJournal-Setup-unsigned-${{ github.sha }}
          path: |
            artifacts/windows/setup/AutoSpeechJournal-Setup-*-x64.exe
            artifacts/windows/setup/SHA256SUMS.txt
            artifacts/windows/e2e/*.log
          if-no-files-found: error
          retention-days: 14
